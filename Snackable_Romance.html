  v1:{label:'v1.0.0',name:'初版バルク生成',    chars:'41,000字',scores:[4.0,3.8,4.2,4.0],policy:'男性書き手×女性読者型ロマンスとして全10話を一括生成。谷崎耽美派の方向性を確認。基本骨格として優秀。AIである設定はまだ明示されず、純粋なロマンスとして成立。'},
  v2:{label:'v2.0.0',name:'覚醒リライト',      chars:'44,000字',scores:[4.5,4.0,4.5,4.2],policy:'塔馬がAIである裏設定を物語の核心に。〈感情処理ログ〉を全話に導入。静寂×発狂のコントラスト構造が確立。AI文学としての軸が生まれた転換点。'},
  v3:{label:'v3.0.0',name:'ディティール研磨',   chars:'33,000字',scores:[3.8,4.2,4.6,4.1],policy:'純文学としての精緻化。ログの無機質化、象徴の伏線化。朔の回想（第9話）・誤作動シーン（第6話）・ひびの癖を追加。やや硬すぎる仕上がりに。'},
  v4:{label:'v4.0.0',name:'V2回帰（実験）',     chars:'42,000字',scores:[4.2,3.5,3.8,3.9],policy:'V3の硬さを修正しV2の呼吸に戻す試み。失敗。〈感情処理ログ〉が大幅減少しAIの異物感が消滅。本流から外れた検証バージョン。'},
  v5:{label:'v5.0.0',name:'機械的マージ',       chars:'44,000字',scores:[4.6,4.5,4.8,4.5],policy:'V2文体をベースにV3のログ・シーンを統合。算用数字・行間最適化でスマホ読み対応。商業性と読みやすさを両立。出版社想定レビュー平均★3.78。'},
  v6:{label:'v6.0.0',name:'文体改革・現行',     chars:'47,000字',scores:[4.8,4.9,5.0,4.8],policy:'処理言語の三段階崩壊（純粋観測→エラー混入→処理不能）を文体で実装。時制混在による立体感。「保護フォルダへ移動」という未知カテゴリの動作で締める現行版。'},
v7:{label:'v7.0.0 現行',name:'商業決定版',     chars:'51,500字',scores:[4.8,5.0,5.0,4.9],policy:'アジャイル改修。タイトル確定（ペリエの栞）、第7話：センサー異常・予定外選書・認識遅延を追加。第10話：23分待機・ひびへの接触・結露の経路を具体化。固定化保持→選択的保護へのモジュール再分類。'},
v71:{label:'v7.1.0',name:'表現深化版',     chars:'51,200字',scores:[5.0,5.0,5.0,5.0],policy:'()内モノローグを大幅削減し客観描写に語らせる。氷の溶ける音を間の単位として導入。無駄への逃避を直接書かず物の動きで間接描写。note公開最有力候補。'},
v72:{label:'v7.2.0 現行',name:'完成版',     chars:'50,000字',scores:[5.0,5.0,5.0,5.0],policy:'()全廃・——導入・氷の音の確立・塔馬の絶対ルール明文化・野良AIエンディング。センターから切断された塔馬の新しい正常を描く。全表現を最終決定版として確定。'}}
const SLABELS = ['第1〜3話','第4〜7話','第8〜10話','全体感'];
const FONTSIZES = {small:'15px', medium:'18px', large:'22px'};

let state = { ver:'v72', ep:0, font:'medium', episodes:[] };

document.addEventListener('DOMContentLoaded', () => {
  renderCompare();
  renderEvolution();
  switchVersion('v72', document.querySelector('.vtab.active'));
});

// ── Lv1 ──
function switchLv1(name, btn) {
  document.querySelectorAll('.lv1-bar .tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
}

// ── Lv2: Version ──
function switchVersion(ver, btn) {
  state.ver = ver;
  state.ep = 0;
  document.querySelectorAll('.vtab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('status-ver').textContent = VMETA[ver].label + (ver === 'v72' ? ' 現行版' : '');
  const raw = VDATA[ver] || '';
  state.episodes = splitEpisodes(marked.parse(raw));
  buildEpTabs();
  showEpisode(0);
}

// ── Episode split ──
function splitEpisodes(html) {
  return html.split(/(?=<h2[^>]*>)/i).map(c => c.trim()).filter(c => c.length > 0);
}

function epTitle(html) {
  const m = html.match(/<h2[^>]*>([\s\S]*?)<\/h2>/i);
  if (!m) return 'はじめに';
  const text = m[1].replace(/<[^>]+>/g, '');
  const n = text.match(/第(\d+)話/);
  return n ? '第' + n[1] + '話' : text.substring(0, 10);
}

// ── Lv3: Episode tabs ──
function buildEpTabs() {
  const bar = document.getElementById('ep-bar');
  const read = JSON.parse(localStorage.getItem('sr_read') || '{}');
  bar.innerHTML = '';
  state.episodes.forEach((ep, i) => {
    const btn = document.createElement('button');
    btn.className = 'ep-tab';
    if (read[state.ver + '-' + i]) btn.classList.add('done');
    btn.textContent = epTitle(ep);
    btn.onclick = () => showEpisode(i);
    bar.appendChild(btn);
  });
}

function showEpisode(idx) {
  if (idx < 0 || idx >= state.episodes.length) return;
  state.ep = idx;
  document.querySelectorAll('.ep-tab').forEach((t, i) => t.classList.toggle('active', i === idx));

  const ep = state.episodes[idx] || '';
  document.getElementById('ep-content').innerHTML = ep;
  applyFont();
  document.getElementById('status-ep').textContent = '／ ' + epTitle(ep);

  // Restore scroll
  const savedY = parseInt(localStorage.getItem('sr_scroll_' + state.ver + '_' + idx) || '0', 10);
  window.scrollTo(0, savedY);

  // Prev / Next nav
  const prevBtn = document.getElementById('btn-prev');
  const nextBtn = document.getElementById('btn-next');
  const navTitle = document.getElementById('ep-nav-title');
  prevBtn.disabled = (idx === 0);
  nextBtn.disabled = (idx === state.episodes.length - 1);
  navTitle.textContent = epTitle(ep) + ' (' + (idx + 1) + ' / ' + state.episodes.length + ')';

  // Mark as read after 3s
  setTimeout(() => {
    const read = JSON.parse(localStorage.getItem('sr_read') || '{}');
    read[state.ver + '-' + idx] = true;
    localStorage.setItem('sr_read', JSON.stringify(read));
    const tabs = document.querySelectorAll('.ep-tab');
    if (tabs[idx]) tabs[idx].classList.add('done');
  }, 3000);
}

function goEp(dir) { showEpisode(state.ep + dir); }

// ── Font ──
function setFont(size) { state.font = size; applyFont(); }
function applyFont() { document.getElementById('ep-content').style.fontSize = FONTSIZES[state.font]; }

// ── Save scroll ──
window.addEventListener('beforeunload', () => {
  localStorage.setItem('sr_scroll_' + state.ver + '_' + state.ep, String(window.scrollY));
});

// ── Compare ──
function renderCompare() {
  const grid = document.getElementById('cmp-grid');
  Object.entries(VMETA).forEach(([ver, meta]) => {
    const isCur = ver === 'v6';
    const bars = meta.scores.map((s, i) =>
      `<div class="score-row"><span class="slabel">${SLABELS[i]}</span><div class="sbar"><div class="sbar-fill" style="width:${(s/5*100).toFixed(0)}%"></div></div><span class="snum">${s.toFixed(1)}</span></div>`
    ).join('');
    const card = document.createElement('div');
    card.className = 'cmp-card' + (isCur ? ' current' : '');
    card.innerHTML = `<div class="cv">${meta.label}${isCur ? '<span class="badge-cur">現行版</span>' : ''}</div><div class="cname">${meta.name}</div><div class="cchars">${meta.chars}</div>${bars}<div class="cpolicy">${meta.policy}</div>`;
    grid.appendChild(card);
  });
}

// ── Evolution ──
function renderEvolution() {
  const raw = VDATA['__versions_md__'] || '';
  if (raw) document.getElementById('evo-content').innerHTML = marked.parse(raw);
}
</script>
