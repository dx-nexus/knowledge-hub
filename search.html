const q    = document.getElementById("q");
const box  = document.getElementById("results");
const cnt  = document.getElementById("count");

function render(docs) {
  if (docs.length === 0) {
    box.innerHTML = '<div class="no-result">該当するドキュメントが見つかりませんでした。</div>';
    cnt.innerHTML = "";
    return;
  }
  box.innerHTML = docs.map(d => `
    <a class="card" href="${d.url}">
      <div class="card-head">
        <div class="card-icon">${d.icon}</div>
        <div>
          <div class="card-title">${d.title} <span class="result-cat">${d.cat}</span></div>
          <div class="card-sub">${d.desc}</div>
        </div>
      </div>
      <div class="card-foot">
        <span class="badge ${d.status === 'wip' ? 'badge-wip' : 'badge-live'}">${d.date}</span>
      </div>
    </a>
  `).join("");
  cnt.innerHTML = `<strong>${docs.length}</strong> 件ヒット`;
}

function search(kw) {
  if (!kw.trim()) { render(DOCS); cnt.innerHTML = `全 <strong>${DOCS.length}</strong> 件`; return; }
  const terms = kw.trim().toLowerCase().split(/\s+/);
  const hit = DOCS.filter(d => {
    const hay = [d.title, d.desc, d.cat, d.tags].join(" ").toLowerCase();
    return terms.every(t => hay.includes(t));
  });
  render(hit);
}

q.addEventListener("input", e => search(e.target.value));

// 初期表示
render(DOCS);
cnt.innerHTML = `全 <strong>${DOCS.length}</strong> 件`;
